name: Repair EF migration snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-ef-migration-main
  cancel-in-progress: false

jobs:
  repair:
    name: Synchronize EF migration snapshot
    runs-on: windows-latest

    env:
      Database__Provider: SqlServer
      ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_EFRepair;Trusted_Connection=True;TrustServerCertificate=True

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TabulariusAI.sln

      - name: Generate temporary snapshot synchronization migration
        run: >-
          dotnet ef migrations add SyncVatAnalysisSnapshot
          --project src/TabulariusAI.Web
          --startup-project src/TabulariusAI.Web
          --configuration Release

      - name: Keep snapshot and discard temporary migration
        shell: pwsh
        run: |
          Get-ChildItem "src/TabulariusAI.Web/Migrations" -Filter "*SyncVatAnalysisSnapshot*.cs" -ErrorAction Stop |
            Remove-Item -Force

      - name: Verify EF Core migration consistency
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/TabulariusAI.Web
          --startup-project src/TabulariusAI.Web
          --configuration Release

      - name: Build
        run: dotnet build TabulariusAI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TabulariusAI.sln --configuration Release --no-build

      - name: Show generated changes
        shell: pwsh
        run: git status --short

      - name: Commit repaired migration snapshot
        shell: pwsh
        run: |
          $snapshot = "src/TabulariusAI.Web/Migrations/TabulariusDbContextModelSnapshot.cs"
          if (-not (git status --porcelain -- $snapshot)) {
            Write-Host "No EF snapshot changes were generated."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $snapshot
          git commit -m "fix: synchronize EF migration snapshot"
          git push origin HEAD:main
