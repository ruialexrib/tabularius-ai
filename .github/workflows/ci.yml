name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test .NET
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TabulariusAI.sln

      - name: Build
        run: dotnet build TabulariusAI.sln --configuration Release --no-restore

      - name: Verify EF Core migration consistency
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_CI;Trusted_Connection=True;TrustServerCertificate=True
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/TabulariusAI.Web
          --startup-project src/TabulariusAI.Web
          --configuration Release
          --no-build

      - name: Run tests with coverage
        run: >-
          dotnet test TabulariusAI.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFilePrefix=test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
