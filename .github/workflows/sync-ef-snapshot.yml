name: Sync EF snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-ef-snapshot.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    env:
      Database__Provider: SqlServer
      ConnectionStrings__Tabularius: 'Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_SnapshotSync;Trusted_Connection=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore TabulariusAI.sln
      - name: Regenerate model snapshot
        run: dotnet ef migrations add SnapshotSyncTemporary --project src/TabulariusAI.Web --startup-project src/TabulariusAI.Web
      - name: Commit snapshot only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TabulariusAI.Web/Migrations/TabulariusDbContextModelSnapshot.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: synchronize EF Core model snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
