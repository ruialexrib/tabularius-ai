name: Synchronize EF Snapshot

on:
  push:
    paths:
      - '.github/workflows/sync-ef-snapshot.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore TabulariusAI.sln
      - name: Regenerate snapshot from current EF model
        shell: pwsh
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: 'Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_SnapshotSync;Trusted_Connection=True;TrustServerCertificate=True'
        run: |
          dotnet ef migrations add __SyncCurrentModel --project src/TabulariusAI.Web --startup-project src/TabulariusAI.Web --output-dir Migrations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem 'src/TabulariusAI.Web/Migrations' -Filter '*__SyncCurrentModel.cs' | Remove-Item -Force
          Get-ChildItem 'src/TabulariusAI.Web/Migrations' -Filter '*__SyncCurrentModel.Designer.cs' | Remove-Item -Force
          dotnet ef migrations has-pending-model-changes --project src/TabulariusAI.Web --startup-project src/TabulariusAI.Web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm .github/workflows/sync-ef-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TabulariusAI.Web/Migrations/TabulariusDbContextModelSnapshot.cs
          git commit -m "fix: synchronize EF Core model snapshot"
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
