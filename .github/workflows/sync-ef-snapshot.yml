name: Synchronize EF Snapshot

on:
  push:
    paths:
      - '.github/workflows/sync-ef-snapshot.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate EF model snapshot
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TabulariusAI.sln

      - name: Regenerate current model snapshot
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_SnapshotSync;Trusted_Connection=True;TrustServerCertificate=True
        shell: pwsh
        run: |
          dotnet ef migrations add SnapshotSyncTemporary --project src/TabulariusAI.Web --startup-project src/TabulariusAI.Web --output-dir Migrations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem 'src/TabulariusAI.Web/Migrations' -Filter '*_SnapshotSyncTemporary.cs' | Remove-Item -Force
          Get-ChildItem 'src/TabulariusAI.Web/Migrations' -Filter '*_SnapshotSyncTemporary.Designer.cs' | Remove-Item -Force

      - name: Verify no model changes remain
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_SnapshotSync;Trusted_Connection=True;TrustServerCertificate=True
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/TabulariusAI.Web
          --startup-project src/TabulariusAI.Web

      - name: Commit synchronized snapshot
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TabulariusAI.Web/Migrations/TabulariusDbContextModelSnapshot.cs
          if (git diff --cached --quiet) {
            Write-Host 'Model snapshot is already synchronized.'
            exit 0
          }
          git commit -m "fix: synchronize EF model snapshot"
          git push origin HEAD:main
