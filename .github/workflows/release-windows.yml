name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag '$tag' must use semantic version format vX.Y.Z." }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_name=TabulariusAI-$version-win-x64" >> $env:GITHUB_OUTPUT
      - name: Verify project version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/TabulariusAI.Web/TabulariusAI.Web.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne '${{ steps.version.outputs.version }}') { throw "Project version '$projectVersion' does not match release version '${{ steps.version.outputs.version }}'." }
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore dependencies
        run: dotnet restore TabulariusAI.sln -r win-x64
      - name: Build
        run: dotnet build TabulariusAI.sln --configuration Release --no-restore
      - name: Verify EF Core migration consistency
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_Release;Trusted_Connection=True;TrustServerCertificate=True
        run: dotnet ef migrations has-pending-model-changes --project src/TabulariusAI.Web --startup-project src/TabulariusAI.Web --configuration Release --no-build
      - name: Run tests
        run: dotnet test TabulariusAI.sln --configuration Release --no-build
      - name: Publish Windows x64 self-contained application
        shell: pwsh
        run: |
          $output = 'artifacts/release/${{ steps.version.outputs.release_name }}'
          dotnet publish src/TabulariusAI.Web/TabulariusAI.Web.csproj --configuration Release --runtime win-x64 --self-contained true --output $output /p:Version=${{ steps.version.outputs.version }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$output/data/tabularius.db" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/data/tabularius.db-shm" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/data/tabularius.db-wal" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/logs" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$output/data" -Force | Out-Null
          New-Item -ItemType Directory -Path "$output/logs" -Force | Out-Null
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $folder = 'artifacts/release/${{ steps.version.outputs.release_name }}'
          Compress-Archive -Path "$folder/*" -DestinationPath "artifacts/release/${{ steps.version.outputs.release_name }}.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=$pwd\artifacts\release\${{ steps.version.outputs.release_name }}" "/DOutputDir=$pwd\artifacts\release" installer\TabulariusAI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TabulariusAI-${{ steps.version.outputs.version }}-windows
          path: |
            artifacts/release/${{ steps.version.outputs.release_name }}.zip
            artifacts/release/TabulariusAI-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = 'artifacts/release/${{ steps.version.outputs.release_name }}.zip'
          $setup = 'artifacts/release/TabulariusAI-Setup-${{ steps.version.outputs.version }}.exe'
          $notes = "Tabularius AI ${{ steps.version.outputs.version }}`n`nWindows: use the installer for normal installation, or the ZIP for portable use.`n`nInitial access: admin / LetMeIn. The temporary password must be changed after signing in.`n`nDocker image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          if (gh release view $tag 2>$null) { gh release upload $tag $zip $setup --clobber } else { gh release create $tag $zip $setup --title "Tabularius AI ${{ steps.version.outputs.version }}" --notes $notes --verify-tag }

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="${{ inputs.tag }}"; else tag="${{ github.ref_name }}"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid release tag: $tag"; exit 1; fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
