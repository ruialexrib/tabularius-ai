name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must use semantic version format vX.Y.Z."
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_name=TabulariusAI-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Verify project version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/TabulariusAI.Web/TabulariusAI.Web.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne '${{ steps.version.outputs.version }}') {
            throw "Project version '$projectVersion' does not match release version '${{ steps.version.outputs.version }}'."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore TabulariusAI.sln -r win-x64

      - name: Build
        run: dotnet build TabulariusAI.sln --configuration Release --no-restore

      - name: Verify EF Core migration consistency
        env:
          Database__Provider: SqlServer
          ConnectionStrings__Tabularius: Server=(localdb)\MSSQLLocalDB;Database=TabulariusAI_Release;Trusted_Connection=True;TrustServerCertificate=True
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/TabulariusAI.Web
          --startup-project src/TabulariusAI.Web
          --configuration Release
          --no-build

      - name: Run tests
        run: dotnet test TabulariusAI.sln --configuration Release --no-build

      - name: Publish Windows x64 self-contained application
        shell: pwsh
        run: |
          $output = 'artifacts/release/${{ steps.version.outputs.release_name }}'
          dotnet publish src/TabulariusAI.Web/TabulariusAI.Web.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $output `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item "$output/data/tabularius.db" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/data/tabularius.db-shm" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/data/tabularius.db-wal" -Force -ErrorAction SilentlyContinue
          Remove-Item "$output/logs" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$output/data" -Force | Out-Null
          New-Item -ItemType Directory -Path "$output/logs" -Force | Out-Null

      - name: Create release ZIP
        shell: pwsh
        run: |
          $folder = 'artifacts/release/${{ steps.version.outputs.release_name }}'
          $zip = "artifacts/release/${{ steps.version.outputs.release_name }}.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -Force

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.release_name }}
          path: artifacts/release/${{ steps.version.outputs.release_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = 'artifacts/release/${{ steps.version.outputs.release_name }}.zip'
          $notes = @"
          ## Tabularius AI ${{ steps.version.outputs.version }}

          First local Windows release of Tabularius AI.

          ### Installation
          1. Download `${{ steps.version.outputs.release_name }}.zip`.
          2. Extract the ZIP to a writable folder.
          3. Run `TabulariusAI.Web.exe`.
          4. The application opens automatically in the default browser.

          The application is self-contained and uses a local SQLite database created on first run. Docker, SQL Server and a separately installed .NET runtime are not required.

          ### Initial access
          - User: `admin`
          - Temporary password: `LetMeIn`

          The administrator must change the temporary password after signing in.
          "@

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Tabularius AI ${{ steps.version.outputs.version }}" --notes $notes --verify-tag
          }
