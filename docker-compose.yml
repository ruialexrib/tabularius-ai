name: tabularius-ai

services:
  tabularius-ai-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${TABULARIUS_DB_PASSWORD:?Define TABULARIUS_DB_PASSWORD in .env}
    volumes:
      - tabularius-ai-sql-data:/var/opt/mssql
    networks:
      - tabularius-ai-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  tabularius-ai-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Server
      Database__Provider: SqlServer
      ConnectionStrings__Tabularius: Server=tabularius-ai-db;Database=TabulariusAI;User Id=sa;Password=${TABULARIUS_DB_PASSWORD};TrustServerCertificate=True
    ports:
      - "8080:8080"
    depends_on:
      tabularius-ai-db:
        condition: service_healthy
    networks:
      - tabularius-ai-network
    restart: unless-stopped

volumes:
  tabularius-ai-sql-data:

networks:
  tabularius-ai-network:
